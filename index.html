<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Matching Game</title>

    <script>
    if (localStorage.getItem("theme") === "light") {
        document.documentElement.classList.add("light");
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="theme-toggle">☀️ Light Mode</button>

    <h1>Card Matching - Made by: DeathMaster001</h1>
    <h2>Match all cards to win!</h2>

    <div class="card-back-selector">
        <h2>Card Back</h2>

        <button class="card-back-option selected" data-back="dark">
            Black
        </button>

        <button class="card-back-option" data-back="white">
            White
        </button>
    </div>

    <button id="start-game">Start Game</button>

    <script src="theme.js"></script>
    <script src="menu.js"></script>
</body>
</html>
